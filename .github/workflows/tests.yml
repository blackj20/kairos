name: Tests

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project from clean checkout
        run: python -m pip install -e .

      - name: Run installed smoke test
        run: kairos --smoke-test

      - name: Run installed GrowUp scan
        run: kairos --growup-scan > growup-scan.json

      - name: Run installed Skill Factory scan
        run: kairos --skill-factory-scan > skill-factory-scan.json

      - name: Compile a declarative route
        run: kairos --route-plan chercher --route-target atome > route-plan.json

      - name: Read observable SECAU status
        run: kairos --secau-status > secau-status.json

      - name: Read research candidates
        run: kairos --research-status > research-status.json

      - name: Compile Python sources
        run: |
          python -m compileall -q kairos tests
          python -m py_compile self_correction_benchmark.py intent_generalization_benchmark.py cognitive_filters_benchmark.py meta_comprehension_benchmark.py benchmark.py holdout.py decision_benchmark.py growup_benchmark.py skill_factory_benchmark.py routing_benchmark.py information_benchmark.py research_secau_benchmark.py user_acceptance.py user_acceptance_additional.py user_acceptance_v05.py user_acceptance_v06.py user_acceptance_v07.py user_acceptance_v08.py user_acceptance_v013.py

      - name: Run unit and end-to-end tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log

      - name: Preserve unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-python-${{ matrix.python-version }}
          path: unittest.log
          if-no-files-found: error

      - name: Enforce internal self-correction
        run: python self_correction_benchmark.py

      - name: Enforce intent generalization
        run: python intent_generalization_benchmark.py

      - name: Enforce cognitive filters
        run: python cognitive_filters_benchmark.py

      - name: Enforce meta-comprehension
        run: python meta_comprehension_benchmark.py

      - name: Enforce skeleton performance
        run: python skeleton_benchmark.py

      - name: Enforce understanding benchmark
        run: python benchmark.py

      - name: Enforce holdout benchmark
        run: python holdout.py

      - name: Enforce decision benchmark
        run: python decision_benchmark.py

      - name: Enforce GrowUp benchmark
        run: python growup_benchmark.py

      - name: Enforce Skill Factory benchmark
        run: python skill_factory_benchmark.py

      - name: Enforce Action Router benchmark
        run: python routing_benchmark.py

      - name: Enforce Information Search benchmark
        run: python information_benchmark.py

      - name: Enforce Research SECAU benchmark
        run: python research_secau_benchmark.py

      - name: Run user acceptance scenarios
        shell: bash
        run: |
          set -o pipefail
          python user_acceptance.py 2>&1 | tee user-acceptance.log

      - name: Run historical user scenarios
        shell: bash
        run: |
          set -o pipefail
          python user_acceptance_additional.py 2>&1 | tee user-acceptance-additional.log

      - name: Run Skill Factory user acceptance
        shell: bash
        run: |
          set -o pipefail
          python user_acceptance_v05.py 2>&1 | tee user-acceptance-v05.log

      - name: Run Action Router user acceptance
        shell: bash
        run: |
          set -o pipefail
          python user_acceptance_v06.py 2>&1 | tee user-acceptance-v06.log

      - name: Run Information Search user acceptance
        shell: bash
        run: |
          set -o pipefail
          python user_acceptance_v07.py 2>&1 | tee user-acceptance-v07.log

      - name: Run Research SECAU user acceptance
        shell: bash
        run: |
          set -o pipefail
          python user_acceptance_v08.py 2>&1 | tee user-acceptance-v08.log

      - name: Run Self-Correction user acceptance
        shell: bash
        run: |
          set -o pipefail
          python user_acceptance_v013.py 2>&1 | tee user-acceptance-v013.log

      - name: Preserve user acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-acceptance-python-${{ matrix.python-version }}
          path: |
            user-acceptance.log
            user-acceptance-additional.log
            user-acceptance-v05.log
            user-acceptance-v06.log
            user-acceptance-v07.log
            user-acceptance-v08.log
            user-acceptance-v013.log
            memory/self_correction_runs/latest.json
            artifacts/user_acceptance/USER_ACCEPTANCE_REPORT.md
            artifacts/user_acceptance/USER_ACCEPTANCE_REPORT.json
            artifacts/user_acceptance/USER_ACCEPTANCE_ADDITIONAL.md
            artifacts/user_acceptance/USER_ACCEPTANCE_ADDITIONAL.json
            artifacts/user_acceptance/USER_ACCEPTANCE_V05.md
            artifacts/user_acceptance/USER_ACCEPTANCE_V05.json
            growup-scan.json
            skill-factory-scan.json
            route-plan.json
            secau-status.json
            research-status.json
          if-no-files-found: error
